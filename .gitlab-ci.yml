image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11

stages:
  - test_python
  - build
  - package
  - test_package

pytest-darwin:
  stage: test_python
  tags:
    - catalina-py311-x64
  script:
    - export ZIPLAUNCHER_CLEAN_TMP=true
    - export UV_PYTHON="3.13.3-x86_64"
    - export UV_PYTHON_PREFERENCE="only-managed"
    - uv self update
    - uv sync --frozen
    - uv run pytest --tb=short -x -o junit_family=xunit2 --junitxml=testreport_darwin.xml --cov-append --cov opsicli --cov plugins --cov-report term --cov-report xml -v tests
    - mv .coverage coverage_darwin
  artifacts:
    name: "opsi-cli_test_darwin"
    paths:
      - coverage.xml
      - testreport_darwin.xml
      - coverage_darwin
    expire_in: 3 days

pytest-windows:
  stage: test_python
  tags:
    - win10-x64
  script:
    - $Env:UV_PYTHON_INSTALL_DIR = "c:\\uv\\python"
    - $Env:UV_CACHE_DIR = "c:\\uv\\cache"
    - $Env:UV_PYTHON = "3.13.3-x86"
    - $Env:UV_PYTHON_PREFERENCE = "only-managed"
    - $Env:RUSTUP_TOOLCHAIN = "stable-i686-pc-windows-msvc"
    - uv sync --frozen
    - uv run pytest --tb=short -x -o junit_family=xunit2 --junitxml=testreport_windows.xml --cov-append --cov opsicli --cov plugins --cov-report term --cov-report xml -v tests
    - Rename-Item -Path .coverage -NewName coverage_windows
  artifacts:
    name: "opsi-cli_test_windows"
    paths:
      - coverage.xml
      - testreport_windows.xml
      - coverage_windows
    expire_in: 3 days

pytest-linux:
  stage: test_python
  tags:
    - docker-x64
  services:
    - name: mysql:8.0
      command:
        - --max_connections=1000
        - --default-authentication-plugin=mysql_native_password
    - name: redislabs/redistimeseries:latest
      alias: redis
    - name: docker.uib.gmbh/opsi/opsi-server:4.3-development
      alias: opsiconfd
  variables:
    FF_NETWORK_PER_BUILD: "1" # Create a new network for each build
    CI_DEBUG_SERVICES: "true" # Show debug information for services in ci
    MYSQL_ROOT_PASSWORD: "opsi"
    MYSQL_DATABASE: "opsitest"
    MYSQL_USER: "opsi"
    MYSQL_PASSWORD: "opsi"
    MYSQL_HOST: mysql
    REDIS_HOST: redis
    OPSI_HOST: opsiconfd
    OPSI_ADMIN_PASSWORD: vhahd8usaz # also hardcoded in tests/utils.py
    OPSI_HOST_ROLE: configserver
    OPSI_HOST_ID: "test.uib.gmbh"
    OPSI_TFTPBOOT: "false"
    OPSICONFD_SSL_SERVER_CERT_SANS: "[opsiconfd]"
    OPSICONFD_MAX_SESSIONS_PER_IP: "1000"
    # when restoring the test backup, this job takes > 60 seconds to start, so gitlab-ci kills it
    #OPSICONFD_RESTORE_BACKUP_URL: "http://binaryindex.uib.gmbh/development/testbackup/all/all/testbackup_all_all_1.1.tar.gz"
    # issue for individually configurable timeouts https://gitlab.com/gitlab-org/gitlab/-/issues/30353
  before_script:
    - for trynum in $(seq 1 30); do curl --insecure https://opsiconfd:4447 && break; sleep 6; done
  script:
    - export UV_PYTHON="3.13.3-x86_64"
    - export UV_PYTHON_PREFERENCE="only-managed"
    - uv self update
    - uv sync --frozen
    - uv run pytest --tb=short -x -o junit_family=xunit2 --junitxml=testreport_linux.xml --cov-append --cov opsicli --cov plugins --cov-report term --cov-report xml -v tests
    - mv .coverage coverage_linux
  artifacts:
    name: "opsi-cli_test_linux"
    paths:
      - coverage.xml
      - testreport_linux.xml
      - coverage_linux
    expire_in: 3 days

lint-pytest:
  stage: test_python
  tags:
    - docker-x64
  needs:
    # We want to combine test coverage from all test jobs
    - job: pytest-windows
      artifacts: true
    - job: pytest-darwin
      artifacts: true
    - job: pytest-linux
      artifacts: true
  script:
    - export UV_PYTHON="3.13.3-x86_64"
    - export UV_PYTHON_PREFERENCE="only-managed"
    - uv self update
    - uv sync --frozen
    - uv run ruff check opsicli plugins tests
    - uv run ty check opsicli plugins tests
    - opsi-dev-cli self upgrade
    - opsi-dev-cli -l info testing merge-junit-testreports testreport_*.xml testreport.xml
    - opsi-dev-cli -l info testing merge-coverage-files coverage_* .coverage
    - opsi-dev-cli -l info testing coverage-report
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    name: "opsi-cli_test"
    paths:
      - coverage.xml
    expire_in: 3 days
    reports:
      junit: testreport.xml

linux-x64-pyinstaller:
  stage: build
  tags:
    - docker-x64
  script:
    - export LC_ALL=C.UTF-8
    - curl -sS "${OPSIDEVTOOLS_INSTALLER_URL_LINUX_X64}" | sh
    - opsi-dev-cli binary pull ziplaunch
    - export UV_PYTHON="3.13.3-x86_64"
    - export UV_PYTHON_PREFERENCE="only-managed"
    - uv self update
    - uv sync --frozen
    - uv run opsi-dev-cli -l info pyinstaller build
    - ./ziplaunch/ziplaunch dist/opsicli ./ziplaunch_data/ziplaunch.ini opsi-cli
    - ./opsi-cli --version
    - ./opsi-cli --non-interactive plugin new cicdtest --version=1.0
    - sed -i 's/import rich_click as click/import rich_click as click; import flask/' cicdtest/python/__init__.py
    - ./opsi-cli -l 7 plugin add cicdtest
    - time ./opsi-cli --help
    - mv ./opsi-cli CLIENT_DATA/opsi-cli-linux-x64.run
    - '[ "$CI_COMMIT_TAG" = "" ] && opsi-dev-cli -l info binary push CLIENT_DATA/opsi-cli-linux-x64.run --prerelease="$CI_JOB_ID"'
    - '[ "$CI_COMMIT_TAG" = "" ] || opsi-dev-cli -l info binary push CLIENT_DATA/opsi-cli-linux-x64.run'
  artifacts:
    name: opsi-cli-linux-x64.run
    paths:
      - CLIENT_DATA/opsi-cli-linux-x64.run

# arm binary pushed to binaryindex, but not included in opsi-package (no arm clients)
