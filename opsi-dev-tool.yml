project:
  licenses:
    - license: AGPL-3.0-only
      header: |
        opsi-cli is part of the device management solution OPSI http://www.opsi.org
        Copyright (c) 2021-{year} uib GmbH <info@uib.de>
        All rights reserved.
        License: {license}

pyinstaller:
  one_file: no
  strip: yes
  before_script:
    - find plugins -name __pycache__ -exec rm -rf {} +
  hidden_imports:
    all:
      - orjson
      - psutil
      - pip._internal.commands.install
      - rich.tree
      - rich.progress
      - purecrypt
    windows:
      - pip._vendor.platformdirs.windows
    darwin:
      - pip._vendor.platformdirs.macos
  collect_submodules:
    - opsicli
    - urllib3
    - opsi
    - opsi.opsi
    - code
  extra_args:
    - --exclude-module=tkinter
    - --exclude-module=pytest
    - --exclude-module=ruff
    - --exclude-module=ty
  scripts:
    - script: run-opsicli
      binaries:
        - opsi-cli
  data_files:
    - src: ${VENV_SITE_PACKAGES}/pip/_vendor/certifi/cacert.pem
      dst: pip/_vendor/certifi
    - src: ${VENV_SITE_PACKAGES}/pipreqs/stdlib
      dst: pipreqs
    - src: ${VENV_SITE_PACKAGES}/pipreqs/mapping
      dst: pipreqs
    - src: plugins/**/*
      dst: plugins
  dirname: opsicli
  locale_install: []
  packages:
    - opsicli

jenkins-test:
  ACTIONREQUEST: setup,setup,uninstall,uninstall,setup
  PRODUCTS: opsi-cli,opsi-cli,opsi-cli,opsi-cli,opsi-cli
  SNAPSHOT: patched
  PROPERTIES: {}
  SYSTEMS: winx64,winx86,linux,macos
