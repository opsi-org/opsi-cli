[project]
name = "opsi-cli"
version = "4.3.19.1"
description = "opsi command line interface"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11,<3.14"
dependencies = [ "annotated-types>=0.7", "click>=8.1", "msgpack>=1.0", "orjson>=3.6", "pip>=25.0.1", "pipreqs>=0.5", "prompt-toolkit>=3.0", "py-purecrypt>=0.1", "pydantic-core>=2.18", "pydantic>=2.5", "python-opsi-common>=4.3.22,<4.4", "pywin32>=308;platform_system=='Windows'", "rich-click>=1.3,<1.8", "ruamel.yaml>=0.18", "starlette>=0.38", "websockets>=13.0",]
[[project.authors]]
name = "uib GmbH"
email = "info@uib.de"

[[project.maintainers]]
name = "uib GmbH"
email = "info@uib.de"

[dependency-groups]
dev = [ "mypy>=1.4", "pyinstaller>=6.0", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "types-psutil>=7.0.0.20250401", "types-pywin32>=310.0.0.20250319", "types-requests>=2.31",]

[project.urls]
Homepage = "https://www.opsi.org"

[project.scripts]
opsi-cli = "opsicli.__main__:main"

[tool.uv]
extra-index-url = [ "https://pypi.uib.gmbh/simple",]
index-strategy = "unsafe-best-match"
package = true

[tool.ruff]
line-length = 140

[tool.mypy]
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
follow_imports = "silent"
incremental = false

[tool.ruff.format]
indent-style = "tab"

[tool.pytest.ini_options]
filterwarnings = [ "ignore::urllib3.exceptions.InsecureRequestWarning",]
markers = [ "opsi_service: mark test to run only if a opsi service is available for testing.", "not_windows: mark test to not run on windows.",]

[tool.setuptools.packages.find]
include = [ "opsicli", "opsicli.*", "plugins", "plugins.*",]
